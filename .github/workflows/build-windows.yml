name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build C++ runtime
        shell: pwsh
        run: |
          cmake -S cpp -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel

      - name: Build ksa.exe
        shell: pwsh
        run: |
          $nativeExecutable = Join-Path $PWD 'build/native/Release/ksa_engine_cpp.exe'
          if (-not (Test-Path $nativeExecutable)) {
            throw "Missing native runtime: $nativeExecutable"
          }
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name 'KSA' `
            --icon 'assets/ksa-engine-k.ico' `
            --add-data 'assets;assets' `
            --add-binary "$nativeExecutable;." `
            --collect-all pygame `
            'desktop_launcher.py'

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/KSA.exe')) {
            throw 'dist/KSA.exe was not produced.'
          }
          Get-Item 'dist/KSA.exe' | Select-Object FullName, Length

      - name: Upload ksa.exe
        uses: actions/upload-artifact@v4
        with:
          name: KSA-windows
          path: dist/KSA.exe
          if-no-files-found: error
