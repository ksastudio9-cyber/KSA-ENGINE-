name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C++ runtime
        shell: pwsh
        run: |
          cmake -S cpp -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DKSA_ENABLE_NATIVE_EDITOR=ON
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure

      - name: Stage native KSA ENGINE.exe
        shell: pwsh
        run: |
          $nativeExecutable = Join-Path $PWD 'build/native/Release/KSA.exe'
          if (-not (Test-Path $nativeExecutable)) {
            $nativeExecutable = Join-Path $PWD 'build/native/KSA.exe'
          }
          if (-not (Test-Path $nativeExecutable)) { throw "Missing native runtime: $nativeExecutable" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $nativeExecutable 'dist/KSA ENGINE.exe' -Force

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/KSA ENGINE.exe')) {
            throw 'dist/KSA ENGINE.exe was not produced.'
          }
          Get-Item 'dist/KSA ENGINE.exe' | Select-Object FullName, Length

      - name: Upload KSA ENGINE.exe
        uses: actions/upload-artifact@v4
        with:
          name: KSA-windows
          path: dist/KSA ENGINE.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/KSA ENGINE.exe
